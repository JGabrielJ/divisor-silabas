{% extends "divisor_app/base.html" %} {% block title %}Entrar | Divisor de
Sílabas{% endblock %} {% block content %}
<section class="row justify-content-center" aria-labelledby="login-title">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5">
    <h1 id="login-title" class="page-title text-center">Acesse sua conta</h1>
    <p class="page-subtitle text-center">Use seu e-mail e senha.</p>

    <div class="panel">
      <form method="post" action="{% url 'login-view' %}">
        {% csrf_token %}

        <div class="mb-3">
          <label for="email" class="form-label field-label">E-mail:</label>
          <input
            id="email"
            name="email"
            type="email"
            class="form-control"
            placeholder="seu_email@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="mb-4">
          <label for="pwd" class="form-label field-label">Senha:</label>
          <input
            id="pwd"
            name="pwd"
            type="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary w-100">Fazer login</button>
      </form>

      <nav
        class="d-flex justify-content-between mt-3 small"
        aria-label="Ações de conta"
      >
        <span>Ainda não possui conta?</span>
        <a href="{% url 'register-view' %}">Cadastrar-se</a>
      </nav>
    </div>
  </div>
</section>
{% endblock %}
